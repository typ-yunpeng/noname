<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国杀斗地主界面</title>
    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.3);
            --gold: #ffcc00;
            --orange: #ff8c00;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            background: #2c1a1a; /* 兜底色 */
        }

        /* 模拟背景图 */
        .game-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #4a3459, #b3706d, #f2c68e);
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 顶部区域：对阵信息 */
        .top-ui {
            display: flex;
            justify-content: center;
            gap: 100px;
            padding-top: 20px;
        }

        .player-card {
            width: 100px;
            height: 140px;
            background: #444;
            border: 2px solid #8b4513;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .player-card::before {
            content: "农";
            position: absolute;
            top: -5px;
            right: -5px;
            background: #4caf50;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* 中间决策区 */
        .decision-area {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }

        .prompt-text {
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 10px 30px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border: 2px solid #5c3016;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 1px 1px 2px #000;
        }

        .btn-no { background: linear-gradient(to bottom, #e67e22, #d35400); }
        .btn-yes { background: linear-gradient(to bottom, #f39c12, #e67e22); color: #fff; border-color: #ffd700; }

        /* 底部手牌区 */
        .bottom-ui {
            height: 220px;
            display: flex;
            align-items: flex-end;
            padding: 0 50px 20px 50px;
            background: rgba(0,0,0,0.2);
            justify-content: space-between;
        }

        .hand-cards {
            display: flex;
            gap: 10px;
        }

        .card {
            width: 110px;
            height: 160px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ccc;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .card-header { font-weight: bold; font-size: 20px; line-height: 1; }
        .suit-red { color: red; }
        .card-name { text-align: center; margin-top: 10px; font-size: 16px; font-weight: bold; }

        /* 右侧角色及技能 */
        .lord-area {
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .skill-grid {
            display: grid;
            grid-template-columns: repeat(2, 70px);
            gap: 5px;
            margin-bottom: 10px;
        }

        .skill-btn {
            background: #5d4037;
            color: #d7ccc8;
            border: 1px solid #4e342e;
            padding: 5px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }

        .skill-btn:hover { background: #6d4c41; }
        .skill-btn.active { background: #bcaaa4; color: #3e2723; }

        .lord-portrait {
            width: 120px;
            height: 180px;
            background: #331d2c;
            border: 2px solid #8e24aa;
            border-radius: 4px;
            position: relative;
        }

        .lord-portrait::before {
            content: "地主";
            position: absolute;
            top: -10px;
            right: -10px;
            background: #d32f2f;
            color: #fff;
            padding: 2px 6px;
            font-size: 14px;
            border-radius: 4px;
        }

    </style>
</head>
<body>
    <div class="game-container">
        <header class="top-ui">
            <div class="player-card"><div style="text-align: center; color: #ccc; font-size: 12px; margin-top: 20px;">韩遂</div></div>
            <div class="player-card"><div style="text-align: center; color: #ccc; font-size: 12px; margin-top: 20px;">谋董昭</div></div>
        </header>

        <section class="decision-area">
            <div class="prompt-text">请选择是否加倍</div>
            <div class="btn-group">
                <button class="btn btn-no">不加倍</button>
                <button class="btn btn-yes">明牌加倍</button>
            </div>
        </section>

        <footer class="bottom-ui">
            <div class="hand-cards">
                <div class="card"><div class="card-header suit-red">J ♦</div><div class="card-name">闪</div></div>
                <div class="card"><div class="card-header suit-red">K ♥</div><div class="card-name">闪</div></div>
                <div class="card"><div class="card-header suit-red">Q ♥</div><div class="card-name">过河拆桥</div></div>
                <div class="card"><div class="card-header suit-red">6 ♥</div><div class="card-name">杀</div></div>
            </div>

            <div class="lord-area">
                <div class="skill-grid">
                    <div class="skill-btn">鹰视</div>
                    <div class="skill-btn active">雄志</div>
                    <div class="skill-btn">跋扈</div>
                    <div class="skill-btn">权变</div>
                    <div class="skill-btn">飞扬</div>
                </div>
                <div class="lord-portrait">
                    <div style="text-align: center; color: #fff; font-size: 14px; margin-top: 20px;">司马懿</div>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
